modLoader = "lowcodefml"
loaderVersion = "[1,)"
license = "MIT"

[[mods]]
modId = "glidecompat"
version = "1.0.0"
displayName = "NeoOrigins Glide Compat"
authors = "gehazet"
description = '''
Fixes NeoOrigins natural gliding (Elytrian, Phantom, Hiveling, Windwalker...) when another mod
(e.g. Clockwork) also redirects ItemStack#canElytraFly on the client. Client-side only.
'''

[[mixins]]
config = "glidecompat.mixins.json"

[[dependencies.glidecompat]]
modId = "neoforge"
type = "required"
versionRange = "[21.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.glidecompat]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,1.22)"
ordering = "NONE"
side = "BOTH"

[[dependencies.glidecompat]]
modId = "neoorigins"
type = "required"
versionRange = "[2.0,)"
ordering = "AFTER"
side = "CLIENT"
